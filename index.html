<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bread&Co - Caffe & Pekara</title>
  <meta name="description" content="Bread&Co - Caffe & Pekara u Sarajevu. Burgeri, wrapovi, deserti i vise.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 48px;
      margin-bottom: 24px;
    }

    .avatar-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px solid #B8956A;
      margin-bottom: 8px;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      padding: 14px;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 24px;
    }

    .ornament-line {
      width: 40px;
      height: 1px;
      background: rgba(184, 149, 106, 0.3);
    }

    .ornament-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(184, 149, 106, 0.4);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(184, 149, 106, 0.1);
      color: #B8956A;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .socials a:active {
      transform: scale(0.95);
      background: rgba(184, 149, 106, 0.2);
    }

    .socials svg { width: 20px; height: 20px; }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-radius: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #FDFBF8;
      color: #1a1a1a;
      border: 1.5px solid #E5E0DA;
    }

    .link-btn:active { transform: scale(0.97); }

    .location-card {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, margin 0.4s ease;
      margin-top: 0;
    }

    .location-card.open {
      max-height: 500px;
      margin-top: 12px;
    }

    .location-inner {
      background: #FDFBF8;
      border: 1.5px solid #E5E0DA;
      border-radius: 14px;
      overflow: hidden;
    }

    .location-inner iframe {
      width: 100%;
      height: 200px;
      border: 0;
      display: block;
    }

    .location-details {
      padding: 20px;
    }

    .location-details h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .location-details p {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .location-details .maps-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 10px 20px;
      background: #1a1a1a;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .location-details .maps-link:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .location-details .maps-link svg {
      width: 14px;
      height: 14px;
    }

    .footer {
      text-align: center;
      padding: 20px 24px;
      font-size: 11px;
      color: rgba(0,0,0,0.2);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <div class="container">

    <section class="profile">
      <div class="avatar-ring">
        <img src="images/logo.png" alt="Bread&Co">
      </div>
    </section>

    <div class="ornament">
      <span class="ornament-line"></span>
      <span class="ornament-dot"></span>
      <span class="ornament-line"></span>
    </div>

    <div class="socials">
      <a href="https://www.instagram.com/breadandco.ba/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </a>
      <a href="https://www.google.com/maps/place/Bread%26Co/@43.8381547,18.3168235,17z/data=!3m1!4b1!4m6!3m5!1s0x4758ca3756b1159d:0x39f79a57262a57a8!8m2!3d43.8381547!4d18.3193984!16s%2Fg%2F11fy5h1ctx" target="_blank" rel="noopener" aria-label="Lokacija">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </a>
    </div>

    <div class="links">
      <a class="link-btn" href="menu.html">Menu</a>
      <button class="link-btn" onclick="document.getElementById('loc').classList.toggle('open')">Lokacije</button>
      <div id="loc" class="location-card">
        <div class="location-inner">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2877.1!2d18.3168235!3d43.8381547!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4758ca3756b1159d%3A0x39f79a57262a57a8!2sBread%26Co!5e0!3m2!1sbs!2sba!4v1"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
          <div class="location-details">
            <h3>Posjeti nas</h3>
            <p>Bread&Co<br>Caffe & Pekara<br>Sarajevo, Bosna i Hercegovina</p>
            <a class="maps-link" href="https://www.google.com/maps/place/Bread%26Co/@43.8381547,18.3168235,17z/data=!3m1!4b1!4m6!3m5!1s0x4758ca3756b1159d:0x39f79a57262a57a8!8m2!3d43.8381547!4d18.3193984!16s%2Fg%2F11fy5h1ctx" target="_blank" rel="noopener">
              Otvori u Maps
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            </a>
          </div>
        </div>
      </div>
      <a class="link-btn" href="https://www.instagram.com/breadandco.ba/" target="_blank" rel="noopener">Instagram</a>
    </div>

  </div>

  <footer class="footer">&copy; 2026 Bread&Co</footer>

</body>
</html>
