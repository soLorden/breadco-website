<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Bread&Co</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f3f0;
      -webkit-font-smoothing: antialiased;
    }

    .menu-pages {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-pages img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: block;
    }
  </style>
</head>
<body>
  <div class="menu-pages">
    <img src="images/page1.png" alt="Meni - Stranica 1">
    <img src="images/page2.png" alt="Meni - Stranica 2">
    <img src="images/page3.png" alt="Meni - Stranica 3">
    <img src="images/page4.png" alt="Meni - Stranica 4">
  </div>
</body>
</html>
