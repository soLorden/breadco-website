<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lokacija - Bread&Co</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #B8956A;
      text-decoration: none;
      margin-bottom: 20px;
      transition: opacity 0.2s ease;
    }

    .back-link:active { opacity: 0.6; }

    .back-link svg { width: 18px; height: 18px; }

    .location-card {
      background: #FDFBF8;
      border: 1.5px solid #E5E0DA;
      border-radius: 16px;
      overflow: hidden;
    }

    .map-container {
      width: 100%;
      height: 240px;
      background: #eee;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .location-info {
      padding: 24px;
    }

    .location-info h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1a1a1a;
    }

    .location-info p {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    .open-maps-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      padding: 14px 28px;
      background: #1a1a1a;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .open-maps-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .open-maps-btn svg { width: 16px; height: 16px; }

    .footer {
      text-align: center;
      padding: 20px 24px;
      font-size: 11px;
      color: rgba(0,0,0,0.2);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <div class="container">

    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Nazad
    </a>

    <div class="location-card">
      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2877.1!2d18.3168235!3d43.8381547!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4758ca3756b1159d%3A0x39f79a57262a57a8!2sBread%26Co!5e0!3m2!1sbs!2sba!4v1"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <div class="location-info">
        <h2>Posjeti nas</h2>
        <p>
          Bread&Co<br>
          Caffe & Pekara<br>
          Sarajevo, Bosna i Hercegovina
        </p>
        <a class="open-maps-btn" href="https://www.google.com/maps/place/Bread%26Co/@43.8381547,18.3168235,17z/data=!3m1!4b1!4m6!3m5!1s0x4758ca3756b1159d:0x39f79a57262a57a8!8m2!3d43.8381547!4d18.3193984!16s%2Fg%2F11fy5h1ctx" target="_blank" rel="noopener">
          Otvori u Maps
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
        </a>
      </div>
    </div>

  </div>

  <footer class="footer">&copy; 2026 Bread&Co</footer>

</body>
</html>
